<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexion - Esteticai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf9f8;
            color: #2a2523;
            padding: 24px;
        }
        .offline-card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(42,37,35,0.04), 0 12px 40px rgba(42,37,35,0.08);
            border: 1px solid #eae8e6;
        }
        .offline-icon { font-size: 52px; margin-bottom: 20px; display: block; }
        h2 {
            font-family: 'Playfair Display', serif;
            color: #2a2523;
            margin-bottom: 12px;
            font-size: 26px;
        }
        p { color: #6b6560; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 32px;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #d4738c, #c25d78);
            color: white;
            box-shadow: 0 2px 8px rgba(212,115,140,0.3);
            transition: all 0.25s ease;
        }
        .btn:hover {
            background: linear-gradient(135deg, #c25d78, #a8506a);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(212,115,140,0.4);
        }
        .brand {
            font-family: 'Playfair Display', serif;
            color: #a8506a;
            font-size: 14px;
            margin-top: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <span class="offline-icon">&#128225;</span>
        <h2>Sin conexion</h2>
        <p>No tienes conexion a internet en este momento. Comprueba tu wifi o datos moviles e intentalo de nuevo.</p>
        <button class="btn" onclick="window.location.reload()">Reintentar</button>
        <p class="brand">Esteticai</p>
    </div>
</body>
</html>
